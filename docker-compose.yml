  # 2. FastAPI Backend (The Engine)
  tennis_api:
    build: .
    container_name: tennis_api
    volumes:
      - .:/project
      - /app/.venv
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://neondb_owner:npg_QjdJIGB0oqe3@ep-gentle-cake-abmd0ftj-pooler.eu-west-2.aws.neon.tech/neondb?sslmode=require&channel_binding=require
      - PYTHONPATH=/project
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - THE_ODDS_API_KEY=${THE_ODDS_API_KEY}

    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    dns:
      - 8.8.8.8
      - 8.8.4.4

  # ── Frontend (builds to ./frontend/dist on the host) ──
  frontend:
    build: ./frontend
    container_name: tennis_ui
    restart: "no"
    working_dir: /project/frontend
    volumes:
      - ./frontend:/project/frontend
      - /project/frontend/node_modules
    command: npm run build
    depends_on:
      - tennis_api

  # ── Nginx reverse proxy + static file server ──
  nginx:
    image: nginx:alpine
    container_name: tennis_proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - tennis_api

  # ── Certbot for SSL certificate management ──
  certbot:
    image: certbot/certbot
    container_name: tennis_certbot
    profiles:
      - tools
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot

volumes:
  # postgres_data:   # removed — using Neon cloud DB
  # pgadmin_data:    # removed — using Neon cloud DB
