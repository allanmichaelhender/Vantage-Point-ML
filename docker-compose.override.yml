services:
  # ── Local dev: run frontend with HMR instead of building ──
  frontend:
    command: npm run dev -- --host
    ports:
      - "5173:5173"

  # ── Local dev: disable nginx (hit frontend directly on :5173) ──
  nginx:
    entrypoint: ["tail", "-f", "/dev/null"]
    ports:
      - "0:80"
      - "0:443"
